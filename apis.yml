name: Quantive
description: >-
  Quantive is a strategy-execution and OKR (Objectives and Key Results) software
  company, originally launched as Gtmhub and rebranded to Quantive in 2021. Its
  flagship product, Quantive Results, helps organizations set, align, track, and
  report on goals and outcomes with dashboards, insights, and integrations. In
  2025 Quantive merged into WorkBoard and the Quantive name became a WorkBoard,
  Inc. trademark; the quantive.com domain now redirects to workboard.com, and the
  live developer surface is the WorkBoard REST API v1.0 (OAuth 2.0 plus an
  instant-token flow) hosted on myworkboard.com. Quantive was surfaced through the
  Index Ventures and Techstars portfolios and added to the API Evangelist network.
