apis:
- name: WorkBoard REST API (Quantive)
  description: >-
    RESTful API v1.0 for the WorkBoard / Quantive strategy-execution platform.
    Supports OAuth 2.0 (authorization-code) for multi-user apps and an
    instant-token flow for single-user or testing scenarios. All requests are
    HTTPS and carry a bearer access token in the Authorization header; OAuth
    access tokens are valid for one year. Registered apps use the "all" scope.
  humanURL: https://www.workboard.com/developer
  baseURL: https://www.myworkboard.com
  tags:
  - OKR
  - Strategy Execution
  - Goal Management
